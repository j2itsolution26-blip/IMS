<!doctype html>
<!--
  Shown by the service worker (public/sw.js) when a page cannot be reached.
  Fully self-contained (inline styles, inline logo, no build assets) so it
  renders even when this deploy's CSS was never cached. It must never hold
  account, sales or inventory data.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0B1A2E" />
    <title>Offline · TindahanProMax</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f8fa;
        --card: #ffffff;
        --text: #0b1a2e;
        --muted: #5b6676;
        --border: #e2e8f0;
        --accent: #0b6b32;
        --accent-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0f1a;
          --card: #111827;
          --text: #f1f5f9;
          --muted: #94a3b8;
          --border: #1f2937;
          --accent: #2db04f;
          --accent-text: #04140a;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 26rem;
        padding: 2rem 1.5rem;
        border: 1px solid var(--border);
        border-radius: 1.25rem;
        background: var(--card);
        text-align: center;
      }
      svg { width: 72px; height: 72px; }
      h1 { margin: 1.25rem 0 0.5rem; font-size: 1.375rem; line-height: 1.3; }
      p { margin: 0 0 0.75rem; color: var(--muted); font-size: 0.9375rem; }
      .note { font-size: 0.8125rem; }
      button {
        width: 100%;
        min-height: 48px;
        margin-top: 1rem;
        border: 0;
        border-radius: 0.75rem;
        background: var(--accent);
        color: var(--accent-text);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 512 512" role="img" aria-label="TindahanProMax">
        <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#2DB04F"/>
              <stop offset="1" stop-color="#0B6B32"/>
            </linearGradient>
          </defs>
          <rect width="512" height="512" rx="112" fill="url(#bg)"/>
          <g transform="translate(9 -9)">
            <path d="M92 148H136L172 316H368L402 184H146" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="206" cy="372" r="26" fill="#fff"/>
            <circle cx="338" cy="372" r="26" fill="#fff"/>
            <g fill="#fff">
              <rect x="200" y="212" width="10" height="76" rx="2"/>
              <rect x="218" y="212" width="6" height="76" rx="2"/>
              <rect x="232" y="212" width="14" height="76" rx="2"/>
              <rect x="254" y="212" width="6" height="76" rx="2"/>
              <rect x="268" y="212" width="10" height="76" rx="2"/>
              <rect x="286" y="212" width="6" height="76" rx="2"/>
              <rect x="300" y="212" width="14" height="76" rx="2"/>
              <rect x="322" y="212" width="6" height="76" rx="2"/>
              <rect x="336" y="212" width="10" height="76" rx="2"/>
              <rect x="354" y="212" width="8" height="76" rx="2"/>
            </g>
            <path d="M188 250H374" stroke="#F59E0B" stroke-width="10" stroke-linecap="round"/>
          </g>
      </svg>

      <h1>You're offline</h1>
      <p>TindahanProMax can't reach the server right now. Check your Wi-Fi or mobile data.</p>
      <p class="note">
        Sales, payments and stock changes can't be recorded while offline. Nothing is queued on
        this device, so no sale is ever recorded twice when the connection returns.
      </p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', function () {
        location.reload();
      });
      // Come back by itself as soon as the connection returns.
      window.addEventListener('online', function () {
        location.reload();
      });
    </script>
  </body>
</html>
